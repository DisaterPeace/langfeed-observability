<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">High-level architecture: each agent owner pushes two telemetry streams</title>
  <desc id="d">Each agent owner (repo-analyzer, bug-detector) independently pushes two streams: stream 1 is OTLP metrics and traces to one shared OTel Collector that the platform provides, which routes to Prometheus and Tempo and then Grafana; stream 2 is LLM traces to that owner's own Langfuse project. The orchestrator is the coordinator that mints session.id. agent.id and session.id are the correlation keys.</desc>
  <rect x="0" y="0" width="1080" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1e293b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker>
  </defs>

  <text x="540" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">High-Level — Each Agent Owner Pushes Two Streams</text>
  <text x="540" y="55" text-anchor="middle" font-size="12" fill="#64748b">Push-only: each owner exports to the Collector we provide; owners never run a collector or expose a scrape endpoint.</text>

  <!-- Legend -->
  <line x1="600" y1="76" x2="636" y2="76" stroke="#1e293b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="642" y="80" font-size="11" fill="#334155">&#9312; OTLP metrics + traces &#8594; shared Collector</text>
  <line x1="600" y1="95" x2="636" y2="95" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="642" y="99" font-size="11" fill="#047857">&#9313; LLM traces &#8594; the owner&#8217;s own Langfuse project</text>

  <!-- platform-side backdrop -->
  <rect x="410" y="112" width="656" height="430" rx="16" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="424" y="132" text-anchor="start" font-size="10.5" font-style="italic" fill="#94a3b8">platform side &#8212; we provide the Collector + central backend</text>

  <!-- ===== Owners (left) ===== -->
  <rect x="26" y="112" width="300" height="430" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="176" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">agent owners + coordinator</text>
  <text x="176" y="153" text-anchor="middle" font-size="9.5" fill="#6366f1">one deployment &#183; each owner its own identity</text>

  <rect x="46" y="166" width="260" height="60" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="176" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">orchestrator &#8212; coordinator</text>
  <text x="176" y="208" text-anchor="middle" font-size="9.5" fill="#6366f1">mints session.id &#183; run-level metrics</text>

  <rect x="46" y="238" width="260" height="80" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="176" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">owner &#183; repo-analyzer</text>
  <text x="176" y="277" text-anchor="middle" font-size="9" fill="#6366f1">service.name = agent.id = repo-analyzer</text>
  <text x="176" y="296" text-anchor="middle" font-size="9.5" fill="#475569">OTel SDK &#160;&#8226;&#160; Langfuse SDK</text>
  <text x="176" y="310" text-anchor="middle" font-size="9" fill="#94a3b8">forks &#9312; + &#9313;</text>

  <rect x="46" y="330" width="260" height="80" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="176" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">owner &#183; bug-detector</text>
  <text x="176" y="369" text-anchor="middle" font-size="9" fill="#6366f1">service.name = agent.id = bug-detector</text>
  <text x="176" y="388" text-anchor="middle" font-size="9.5" fill="#475569">OTel SDK &#160;&#8226;&#160; Langfuse SDK</text>
  <text x="176" y="402" text-anchor="middle" font-size="9" fill="#94a3b8">forks &#9312; + &#9313;</text>

  <rect x="46" y="424" width="260" height="102" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="176" y="445" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3730a3">mandatory OTel resource (every signal)</text>
  <text x="176" y="462" text-anchor="middle" font-size="9.5" fill="#4338ca">service.name &#183; service.version &#183; agent.id</text>
  <text x="176" y="477" text-anchor="middle" font-size="9.5" fill="#4338ca">deployment.environment</text>
  <text x="176" y="494" text-anchor="middle" font-size="9.5" fill="#4338ca">session.id &#8212; stamped on every trace</text>
  <text x="176" y="513" text-anchor="middle" font-size="9" font-style="italic" fill="#6366f1">agent.id + session.id = correlation keys</text>

  <!-- ===== Shared Collector + central backend ===== -->
  <rect x="442" y="168" width="176" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="530" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">OTel Collector</text>
  <text x="530" y="215" text-anchor="middle" font-size="9.5" fill="#475569">shared &#183; we provide it</text>
  <text x="530" y="230" text-anchor="middle" font-size="9.5" fill="#475569">OTLP &#183; TLS + bearer token</text>

  <rect x="694" y="126" width="150" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="769" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Prometheus</text>
  <text x="769" y="165" text-anchor="middle" font-size="9" fill="#64748b">metrics &#183; job = agent.id</text>

  <rect x="694" y="192" width="150" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="769" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Tempo</text>
  <text x="769" y="231" text-anchor="middle" font-size="9" fill="#64748b">spans &#183; one trace / run</text>

  <rect x="902" y="150" width="150" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="977" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Grafana</text>
  <text x="977" y="196" text-anchor="middle" font-size="9" fill="#64748b">central dashboards</text>
  <text x="977" y="209" text-anchor="middle" font-size="9" fill="#64748b">+ trace view</text>

  <!-- ===== Langfuse (per-owner projects) ===== -->
  <rect x="442" y="360" width="318" height="178" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="601" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Langfuse</text>
  <text x="601" y="402" text-anchor="middle" font-size="9.5" fill="#059669">one project per owner &#183; isolation + billing</text>
  <rect x="462" y="416" width="134" height="104" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="529" y="440" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">project</text>
  <text x="529" y="458" text-anchor="middle" font-size="11" fill="#065f46">repo-analyzer</text>
  <text x="529" y="480" text-anchor="middle" font-size="8.5" fill="#059669">its traces</text>
  <text x="529" y="493" text-anchor="middle" font-size="8.5" fill="#059669">+ session.id</text>
  <rect x="606" y="416" width="134" height="104" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="673" y="440" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">project</text>
  <text x="673" y="458" text-anchor="middle" font-size="11" fill="#065f46">bug-detector</text>
  <text x="673" y="480" text-anchor="middle" font-size="8.5" fill="#059669">its traces</text>
  <text x="673" y="493" text-anchor="middle" font-size="8.5" fill="#059669">+ eval scores</text>

  <!-- ===== Stream 1: each identity -> shared collector (fan-in) ===== -->
  <line x1="306" y1="196" x2="442" y2="198" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="306" y1="268" x2="442" y2="214" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="306" y1="360" x2="442" y2="232" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="372" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">&#9312;</text>
  <text x="388" y="300" text-anchor="middle" font-size="9" fill="#64748b">each owner exports OTLP</text>

  <!-- collector -> backends -->
  <line x1="618" y1="196" x2="694" y2="156" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="655" y="168" text-anchor="middle" font-size="8.5" fill="#64748b">metrics</text>
  <line x1="618" y1="220" x2="694" y2="216" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="655" y="238" text-anchor="middle" font-size="8.5" fill="#64748b">spans</text>
  <line x1="844" y1="150" x2="902" y2="178" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="844" y1="216" x2="902" y2="196" stroke="#1e293b" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- ===== Stream 2: each owner -> its own project ===== -->
  <line x1="306" y1="300" x2="529" y2="413" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <line x1="306" y1="392" x2="671" y2="413" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="415" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">&#9313;</text>

  <!-- Correlation -->
  <text x="540" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Correlation: agent.id (which owner) + session.id (which run) &#8212; one run joins across both projects &amp; the shared backend</text>
</svg>
