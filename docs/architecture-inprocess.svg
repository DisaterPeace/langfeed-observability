<svg viewBox="0 0 1020 466" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Low-level in-process telemetry path inside one agent owner</title>
  <desc id="d">Inside one agent owner: app code emits through the OpenTelemetry SDK (Tracer and Meter providers) to an OTLP exporter (TLS plus bearer token) that pushes to the shared Collector; the LLM call is wrapped by the Langfuse decorator and exported directly to this owner's Langfuse project. Every OTel signal carries the mandatory resource attributes; agent.id and session.id are the correlation keys back to the coordinator.</desc>
  <rect x="0" y="0" width="1020" height="466" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1e293b"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker>
  </defs>

  <text x="510" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Low-Level — In-Process Path Inside One Agent Owner</text>
  <text x="510" y="51" text-anchor="middle" font-size="11.5" fill="#64748b">Every owner runs this same path; owners differ only by identity (agent.id) and their Langfuse project.</text>

  <!-- Legend -->
  <line x1="360" y1="70" x2="392" y2="70" stroke="#1e293b" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="398" y="74" font-size="10.5" fill="#334155">&#9312; OTLP &#8594; shared Collector</text>
  <line x1="590" y1="70" x2="622" y2="70" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#g2)"/>
  <text x="628" y="74" font-size="10.5" fill="#047857">&#9313; LLM trace &#8594; this owner&#8217;s Langfuse project</text>

  <!-- owner process boundary -->
  <rect x="34" y="92" width="600" height="344" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="54" y="115" font-size="12.5" font-weight="700" fill="#4338ca">inside one agent owner &#160;(e.g. repo-analyzer)</text>

  <!-- app code -->
  <rect x="60" y="214" width="150" height="78" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">app code</text>
  <text x="135" y="267" text-anchor="middle" font-size="9.5" fill="#6366f1">the agent&#8217;s work</text>

  <!-- stream 1: OTel SDK -> OTLP exporter -->
  <rect x="252" y="140" width="172" height="62" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="338" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">OpenTelemetry SDK</text>
  <text x="338" y="184" text-anchor="middle" font-size="9.5" fill="#475569">Tracer + Meter providers</text>

  <rect x="452" y="140" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="527" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">OTLP exporter</text>
  <text x="527" y="184" text-anchor="middle" font-size="9.5" fill="#475569">TLS + bearer token</text>

  <!-- stream 2: LLM call -->
  <rect x="252" y="300" width="222" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="363" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">LLM call &#183; Langfuse decorator</text>
  <text x="363" y="344" text-anchor="middle" font-size="9.5" fill="#059669">@observe &#8594; generation</text>

  <!-- resource callout -->
  <rect x="60" y="378" width="546" height="46" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="333" y="396" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3730a3">OTel resource on every signal: service.name &#183; service.version &#183; agent.id &#183; deployment.environment</text>
  <text x="333" y="413" text-anchor="middle" font-size="9.5" fill="#4338ca">session.id stamped on every trace &#8212; agent.id + session.id = correlation keys back to the coordinator</text>

  <!-- targets outside -->
  <rect x="686" y="140" width="300" height="62" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="836" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">OTel Collector (shared)</text>
  <text x="836" y="184" text-anchor="middle" font-size="9" fill="#64748b">metrics &#8594; Prometheus &#183; spans &#8594; Tempo &#8594; Grafana</text>

  <rect x="686" y="300" width="300" height="62" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="836" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Langfuse project &#8212; this owner</text>
  <text x="836" y="344" text-anchor="middle" font-size="9" fill="#059669">one trace / session &#183; generations + scores</text>

  <!-- arrows stream 1 -->
  <line x1="210" y1="236" x2="252" y2="180" stroke="#1e293b" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="232" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">&#9312;</text>
  <line x1="424" y1="171" x2="452" y2="171" stroke="#1e293b" stroke-width="2.4" marker-end="url(#a2)"/>
  <line x1="602" y1="171" x2="686" y2="171" stroke="#1e293b" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="644" y="162" text-anchor="middle" font-size="9" fill="#64748b">OTLP :4318 &#183; TLS + bearer</text>

  <!-- arrows stream 2 -->
  <line x1="210" y1="270" x2="252" y2="326" stroke="#059669" stroke-width="2.4" marker-end="url(#g2)"/>
  <text x="232" y="312" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">&#9313;</text>
  <line x1="474" y1="331" x2="686" y2="331" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#g2)"/>
  <text x="580" y="322" text-anchor="middle" font-size="9" fill="#047857">Langfuse SDK (direct)</text>
</svg>
