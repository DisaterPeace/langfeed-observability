# ============================================================================
# Prometheus — scrape config. Prometheus PULLS metrics on an interval.
# Our only target (for now) is the OTel Collector's :8889 endpoint, where it
# republishes every metric our app sent it.
# ============================================================================

global:
  scrape_interval: 5s             # dev: scrape often so graphs feel live
  evaluation_interval: 10s        # how often alert rules are evaluated

# Alert rules are evaluated by Prometheus and shown in its /alerts page.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: otel-collector
    # honor_labels: keep the `job`/`instance` the Collector already stamped on each
    # series (job = the emitting identity's service.name: agent-orchestrator,
    # repo-analyzer, bug-detector). Without this, Prometheus overwrites job with
    # this scrape's name ("otel-collector") and the per-owner identity is lost.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]   # docker DNS again
